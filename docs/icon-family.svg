<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
<!--
  The family mark is a K, where each product icon is a cap: a cap here made the
  students icon read as the site's and graders as its guest.

  The glyph is a path, not text, so no installed font changes it. It spans
  y 32..96, the caps' height (33..94), so the three read as one set.

  The red is #A3111F, the one both store icons ship on, so the mark and the
  two icons beside it on the link-preview card are one red. It is the cap
  icon's #962427 as displayed: that PNG carried a "Color LCD" display profile,
  which a colour-managed viewer applies, so an untagged #962427 beside it
  looked duller. Icons here are untagged sRGB.
-->
  <rect x="1" y="1" width="126" height="126" rx="28" fill="#A3111F"/>
  <path fill="#fff" d="M34 32 H51 V59 L75 32 H94 L67 61 L96 96 H76 L56 69 L51 74.5 V96 H34 Z"/>
</svg>
